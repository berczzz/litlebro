spring:
  application:
    name: litlebro

  # 启动 banner：以 UTF-8 读取 banner.txt（ASCII 图形含 Unicode 块字符）
  banner:
    charset: UTF-8

  servlet:
    multipart:
      # 单文件大小上限（RAG 文档上传）
      max-file-size: ${APP_MAX_FILE_SIZE:50MB}
      # 单次请求总大小上限
      max-request-size: ${APP_MAX_REQUEST_SIZE:60MB}
      file-size-threshold: 2MB

  http:
    client:
      # HTTP 客户端超时：qwen3.8-max 处理大图/复杂问题时思考耗时可达数分钟，
      # 默认 10 秒读超时会导致大图请求 ReadTimeout，需放宽（毫秒）
      connect-timeout: ${APP_HTTP_CONNECT_TIMEOUT:60000}
      read-timeout: ${APP_HTTP_READ_TIMEOUT:300000}

  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.vectorstore.milvus.MilvusVectorStoreAutoConfiguration

  ai:
    openai:
      api-key: ${OPEN_AI_API_KEY:''}
      # 注意：Spring AI 会在 base-url 后自动拼接 /v1/chat/completions（chat）与 /v1/embeddings（embedding），
      # 因此 base-url 一律不要带尾部 /v1
      base-url: ${OPEN_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${OPEN_AI_BASE_MODEL:qwen3.8-max}
          temperature: 0.7
          # 输出 token 上限收敛为 8192：主对话/流式/压缩共用，避免单轮输出过大挤占上下文窗口
          max-tokens: ${APP_CHAT_MAX_TOKENS:8192}
      embedding:
        # 向量化端点可独立于对话端点（对话走一个 ENS、向量化走另一个 ENS 或 dashscope 兼容端点）
        base-url: ${OPEN_AI_EMBED_BASE_URL:${OPEN_AI_BASE_URL:}}
        api-key: ${OPEN_AI_EMBED_API_KEY:${OPEN_AI_API_KEY:''}}
        options:
          # 向量化模型需与所选端点匹配：dashscope 用 text-embedding-v3/v4，ModelScope ENS 用其部署的 embed 模型 id
          model: ${APP_EMBED_MODEL:qwen3.7-text-embedding}
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 1000
          multiplier: 2
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          username: ${MILVUS_USERNAME:}
          password: ${MILVUS_PASSWORD:}
        database-name: agent_memory
        collection-name: agent_memories
        index-type: IVF_FLAT
        metric-type: COSINE
        embedding-dimension: 1536
        initialize-schema: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms

app:
  attachment:
    # 附件落盘根目录（相对项目根或绝对路径均可）
    dir: ${APP_ATTACHMENT_DIR:./data/attachments}
    # 附件存活天数，到期由定时任务清理（原文件 + 懒解析 txt）
    ttl-days: ${APP_ATTACHMENT_TTL_DAYS:7}
    # 清理任务执行间隔（毫秒），默认 1 小时
    cleanup-interval-ms: ${APP_ATTACHMENT_CLEANUP_INTERVAL_MS:3600000}
    # 单附件大小上限（字节）
    max-size: ${APP_ATTACHMENT_MAX_SIZE:20971520}
    # grep_file 默认最多返回的匹配行数
    max-lines: ${APP_ATTACHMENT_MAX_LINES:100}
    # read_file/grep_file 单次返回的硬上限：行数（防全量读取大文件）
    tool-max-lines: ${APP_ATTACHMENT_TOOL_MAX_LINES:500}
    # read_file/grep_file 单次返回的硬上限：字符数（防单次结果撑爆上下文）
    tool-max-chars: ${APP_ATTACHMENT_TOOL_MAX_CHARS:12000}
    # 附件注册表存储: local(默认, 本地内存, 重启丢失) | redis（Redis, 重启不丢）
    registry:
      type: ${APP_ATTACHMENT_REGISTRY_TYPE:local}
    # 图片直传前压缩：降低输入 token 与模型推理耗时（默认最长边 1024，JPEG 质量 0.85）
    image:
      # 最长边像素上限，超过则等比缩小；设 0 表示不压缩
      max-dimension: ${APP_ATTACHMENT_IMAGE_MAX_DIMENSION:1024}
      # JPEG 重编码质量（0~1），带透明通道的图保持 PNG 编码
      jpeg-quality: ${APP_ATTACHMENT_IMAGE_JPEG_QUALITY:0.85}
  memory:
    # 短期记忆（STM）存储: local(默认) | redis
    stm:
      type: ${APP_MEMORY_STM_TYPE:local}
    # 长期记忆（LTM）存储: local(默认) | milvus
    ltm:
      type: ${APP_MEMORY_LTM_TYPE:local}
      # Milvus 会话记忆分片数：按 sessionId 哈希取模路由到 N 个 collection（{prefix}_{i}），
      # 文档知识库走独立 collection（{prefix}_doc），与会话记忆物理隔离
      milvus-shards: ${APP_MEMORY_LTM_MILVUS_SHARDS:16}
      # Milvus collection 名前缀
      milvus-collection-prefix: ${APP_MEMORY_LTM_MILVUS_PREFIX:agent_memories}
    # 上下文压缩配置
    context:
      # 模型上下文窗口大小（token），超阈值的会话历史会被压缩
      max-tokens: ${APP_MEMORY_CONTEXT_MAX_TOKENS:128000}
      # 触发压缩的阈值（上下文占用/窗口）：默认 0.7，给 A+ 后台压缩留出缓冲
      compact-threshold: ${APP_MEMORY_COMPACT_THRESHOLD:0.7}
      # 压缩时保留的最近消息条数（0 = 全量压缩）
      compact-keep-messages: ${APP_MEMORY_COMPACT_KEEP_MESSAGES:6}
      # 压缩边界安全余量（消息序号）：保证保留的最近消息永不被回收/恢复过滤
      compact-boundary-margin: ${APP_MEMORY_COMPACT_BOUNDARY_MARGIN:1}
      # 下一轮请求等待上一轮压缩完成的最长时间（毫秒），超时按旧上下文继续（降级）
      compact-wait-timeout-ms: ${APP_MEMORY_COMPACT_WAIT_TIMEOUT_MS:60000}
      # 压缩时是否回收长期记忆中的旧原文（默认 false：保留全部原文供 search_memory 语义检索回溯；
      # true 时删除 seq <= 压缩边界的 CATEGORY_CHAT 记录，长期记忆只保留摘要+事实+最近增量）
      reclaim-on-compact: ${APP_MEMORY_COMPACT_RECLAIM:false}
    # 向量检索配置
    vector:
      # 语义检索相似度阈值：低于该值的片段视为不相关，默认 0.2（宽召回，配合 LLM 精排）
      similarity-threshold: ${APP_MEMORY_VECTOR_SIMILARITY_THRESHOLD:0.2}
      # 向量库写入时的 embedding 分批大小（条/请求），减少大文档入库的 HTTP 调用次数（本地/Milvus/语义切块共用；dashscope 单请求上限 10 条）
      embed-batch-size: ${APP_MEMORY_VECTOR_EMBED_BATCH_SIZE:10}
    # 会话记忆检索工具二次过滤阈值：低于该分数的片段丢弃
    min-score: ${APP_MEMORY_MIN_SCORE:0.35}
  # Embedding 缓存：相同文本的 embedding 向量缓存，避免重复调用 embedding API
  embedding:
    cache:
      # 存储后端: local(默认, 本地内存 LRU, 重启丢失) | redis（Redis + TTL，重启不丢）
      type: ${APP_EMBEDDING_CACHE_TYPE:local}
      # 本地缓存容量上限（条数）：embedding 向量约 6KB/条(1536 维)，5000 条约 30MB
      max-entries: ${APP_EMBEDDING_CACHE_MAX_ENTRIES:5000}
      # Redis 缓存 TTL（小时），过期后重新请求 embedding
      ttl-hours: ${APP_EMBEDDING_CACHE_TTL_HOURS:24}
  stream:
    # 流式接口（POST /api/agent/chat/stream）专属配置
    # 是否显式请求模型开启思考（DashScope 兼容模式 enable_thinking），开启后 SSE 会推送 reasoning 事件；
    # 若模型默认输出思考则无需开启
    enable-thinking: ${APP_STREAM_ENABLE_THINKING:false}
    # OpenAI 兼容补全接口路径
    completions-path: /v1/chat/completions
  rag:
    # 文档知识库检索工具二次过滤阈值：低于该分数的片段丢弃
    min-score: ${APP_RAG_MIN_SCORE:0.35}
    # 单份文档解析文本长度上限（字符），超限截断，防止大文件耗尽内存
    max-text-length: ${APP_RAG_MAX_TEXT_LENGTH:3000000}
    # 文档切块并发入库并行度：切块分为 N 组并发写入向量库（每组内部仍按 embed-batch-size 分批 embedding），
    # 并发度越高入库越快，但会增加 dashscope 的并发请求数，429 时 Spring AI 会自动重试
    ingest-parallelism: ${APP_RAG_INGEST_PARALLELISM:4}
    # 文档解析缓存：文件内容哈希为 key，重复上传时跳过解析（图片型文档避免重复调用视觉模型）
    cache:
      # 存储后端: local(默认, 本地内存) | redis（写入 Redis，带 TTL，重启不丢）
      type: ${APP_RAG_CACHE_TYPE:local}
      # 缓存 TTL（小时），过期后重新解析
      parse-ttl-hours: ${APP_RAG_CACHE_PARSE_TTL_HOURS:24}
      # 本地缓存容量上限（条数）：单条可达 max-text-length，无上限会被持续上传的新文件耗尽内存
      max-entries: ${APP_RAG_CACHE_MAX_ENTRIES:100}
    # 图片内容视觉描述配置（图片型 PDF 页面、直接上传的图片文件）
    vision:
      # 是否启用视觉描述：启用后图片内容用多模态模型描述为文字后入库
      enabled: ${APP_RAG_VISION_ENABLED:true}
      # 视觉描述模型（OpenAI 兼容端点，可指向任意兼容视觉模型；空值复用主模型 spring.ai.openai.chat.options.model）
      model: ${APP_RAG_VISION_MODEL:}
      # 独立 API Key（可选），空值复用主对话 Key（spring.ai.openai.api-key）
      api-key: ${APP_RAG_VISION_API_KEY:}
      # 独立服务地址（可选），空值复用主对话端点（spring.ai.openai.base-url，兼容模式）
      base-url: ${APP_RAG_VISION_BASE_URL:}
      # 压缩后图片字节上限，超限跳过识别并降级（防超大 payload 撑爆内存/超接口上限）
      max-image-bytes: ${APP_RAG_VISION_MAX_IMAGE_BYTES:10485760}
      # 并发视觉请求上限，封顶瞬时内存峰值
      max-concurrency: ${APP_RAG_VISION_MAX_CONCURRENCY:2}
      # 渲染 PDF 页面的 DPI，越高描述越准但耗时越长
      pdf-dpi: ${APP_RAG_VISION_PDF_DPI:150}
    # 文档切块策略: semantic(默认) | fixed
    splitter:
      strategy: ${APP_RAG_SPLITTER:semantic}
      # fixed 策略：固定 token 切块大小
      fixed-chunk-size: ${APP_RAG_FIXED_CHUNK:500}
      # semantic 策略：断点判定模式 percentile(默认) | fixed
      semantic-breakpoint-mode: ${APP_RAG_SEMANTIC_MODE:percentile}
      # percentile 模式：差异序列取第 N 百分位为断点阈值
      semantic-percentile: ${APP_RAG_SEMANTIC_PERCENTILE:95}
      # fixed 模式：相邻段相似度低于该值处断句
      semantic-threshold: ${APP_RAG_SEMANTIC_THRESHOLD:0.7}
      # semantic 策略：滑动窗口大小
      semantic-buffer-size: ${APP_RAG_SEMANTIC_BUFFER:3}
      # semantic 策略：单块最大字符数，超限二次固定切分
      semantic-max-chunk: ${APP_RAG_SEMANTIC_MAX_CHUNK:800}
      # semantic 策略：语义向量化的段数上限，超过则跳过向量化直接固定切分（防大表格逐行成段导致海量请求）
      semantic-max-segments: ${APP_RAG_SEMANTIC_MAX_SEGMENTS:500}
  tool:
    # 工具禁用状态存储
    store:
      # 存储后端: local(默认, 本地内存, 重启丢失) | redis（Redis, 重启不丢）
      type: ${APP_TOOL_STORE_TYPE:local}
  router:
    # 检索前路由层总开关：false 时路由不生效，search_memory/search_document 常驻（退回旧行为）
    enabled: ${APP_ROUTER_ENABLED:true}
    # 歧义词（文档/文件/数据等）是否启用轻量 LLM 兜底分类；false 时歧义词一律默认 both（保召回）
    llm-fallback: ${APP_ROUTER_LLM_FALLBACK:true}
    # 喂给路由器的最近对话历史条数，用于消解"这个/那份"等指代
    history-size: ${APP_ROUTER_HISTORY_SIZE:6}
    # 路由专用 LLM（OpenAI 兼容端点，可独立指向 qwen/DeepSeek）；空值回落主对话配置
    llm:
      base-url: ${APP_ROUTER_LLM_BASE_URL:}
      api-key: ${APP_ROUTER_LLM_API_KEY:}
      model: ${APP_ROUTER_LLM_MODEL:}
      temperature: ${APP_ROUTER_LLM_TEMPERATURE:0.0}
      max-tokens: ${APP_ROUTER_LLM_MAX_TOKENS:256}
      # 结构化输出模式: none(纯提示词,保留 max-tokens) | json_object(默认,服务端保证合法 JSON) | json_schema(严格 schema,部分模型支持)
      # 非 none 时 max-tokens 不生效（结构化输出下设置会因截断产生非法 JSON）
      response-format: ${APP_ROUTER_LLM_RESPONSE_FORMAT:json_object}
      # 路由 LLM 输出不合规(解析失败/target 非法)时的重试次数，每次把错误反馈给模型重出
      max-retries: ${APP_ROUTER_LLM_MAX_RETRIES:1}
    # 强文档知识库指示词：命中即硬路由 document
    strong-document-keywords: ["知识库", "文档库", "之前上传的文档", "上传到知识库", "全局文档", "库里有没有", "知识库里有"]
    # 强会话记忆指示词：命中即硬路由 memory；同时供 search_memory 判定"回溯问题需补检原文"
    strong-memory-keywords: ["之前", "刚才", "你说过", "你答过", "我们聊过", "上次", "记得吗", "上一轮", "前面说过", "昨天", "前天", "回顾", "继续", "上次聊", "接着聊"]
    # 弱/歧义检索词：不硬路由，走 LLM 兜底或默认 both
    weak-keywords: ["文档", "文件", "数据", "报表", "资料", "记录", "手册", "报告", "内容", "信息", "查询", "查一下", "查查", "检索", "看看", "里面的", "里写", "中提到", "提到"]
    # 附件指代词：本次带附件且问题命中时优先判定为附件问题（不拉全局检索库）
    attachment-ref-words: ["附件", "这个文档", "这份", "上传的文件", "上传的", "我刚发的", "我发的", "随消息"]
  skill:
    # 技能（Skills）模块总开关：false 时 SkillService/工具/Controller 全部不加载
    enabled: ${APP_SKILL_ENABLED:false}
    # 技能包根目录：技能按 {dir}/{skillId}/SKILL.md（必填）+ scripts/ + references/ + assets/ 预置
    dir: ${APP_SKILL_DIR:./data/skills}
    # 技能存储（enabled=true 时生效）
    store:
      # 存储后端: local(默认, 本地内存, 重启丢失) | redis（Redis, 重启不丢）
      type: ${APP_SKILL_STORE_TYPE:local}
    # 技能脚本执行配置
    exec:
      # 执行总开关：false 时 exec_skill 一律拒绝（load_skill/read_skill_file 不受影响）
      enabled: ${APP_SKILL_EXEC_ENABLED:false}
      # 单脚本执行超时（毫秒），超时强杀进程
      timeout-ms: ${APP_SKILL_EXEC_TIMEOUT_MS:30000}
      # 单次执行输出返回上限（字符），超限截断
      output-max-chars: ${APP_SKILL_EXEC_OUTPUT_MAX_CHARS:8192}
      # 解释器白名单：扩展名映射/shebang 得到的解释器必须在此列表中
      interpreter-allow-list: ${APP_SKILL_EXEC_INTERPRETER_ALLOW_LIST:python3,node,bash,powershell}
    # 静态预注册的技能定义列表（启动时同名跳过，不覆盖动态改动）
    skills: []
  mcp:
    # MCP（Model Context Protocol）Client 模块总开关：false 时不装配任何 MCP 组件
    enabled: ${APP_MCP_ENABLED:false}
    # MCP 服务器存储（enabled=true 时生效）
    store:
      # 存储后端: local(默认, 本地内存, 重启丢失) | redis（Redis, 重启不丢）
      type: ${APP_MCP_STORE_TYPE:local}
    # 单次 MCP 请求超时（毫秒），如 initialize / listTools / callTool
    request-timeout-ms: ${APP_MCP_REQUEST_TIMEOUT_MS:15000}
    # 工具列表缓存 TTL（秒）：过期后重新 listTools 刷新该服务器的工具集
    tool-cache-ttl-seconds: ${APP_MCP_TOOL_CACHE_TTL_SECONDS:60}

server:
  port: 8080

logging:
  level:
    com.litlebro.agent: DEBUG
    org.springframework.ai.chat.client.advisor: DEBUG
