spring:
  application:
    name: litlebro

  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.vectorstore.milvus.MilvusVectorStoreAutoConfiguration

  ai:
    openai:
      api-key: ${OPEN_AI_API_KEY:''}
      base-url: ${OPEN_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: qwen3.8-max
          temperature: 0.7
          max-tokens: 131072
      embedding:
        options:
          model: text-embedding-v3
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 1000
          multiplier: 2
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          username: ${MILVUS_USERNAME:}
          password: ${MILVUS_PASSWORD:}
        database-name: agent_memory
        collection-name: agent_memories
        index-type: IVF_FLAT
        metric-type: COSINE
        embedding-dimension: 1536
        initialize-schema: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms

app:
  memory:
    # 短期记忆（STM）存储: inmemory(默认) | redis
    stm:
      type: ${APP_MEMORY_STM_TYPE:redis}
    # 长期记忆（LTM）存储: inmemory(默认) | milvus
    ltm:
      type: ${APP_MEMORY_LTM_TYPE:inmemory}
    # 上下文压缩配置
    context:
      # 模型上下文窗口大小（token），超阈值的会话历史会被压缩
      max-tokens: ${APP_MEMORY_CONTEXT_MAX_TOKENS:128000}

server:
  port: 8080

logging:
  level:
    com.litlebro.agent: DEBUG
    org.springframework.ai.chat.client.advisor: DEBUG
