spring:
  application:
    name: litlebro

  servlet:
    multipart:
      # 单文件大小上限（RAG 文档上传）
      max-file-size: ${APP_MAX_FILE_SIZE:50MB}
      # 单次请求总大小上限
      max-request-size: ${APP_MAX_REQUEST_SIZE:60MB}
      file-size-threshold: 2MB

  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.vectorstore.milvus.MilvusVectorStoreAutoConfiguration

  ai:
    openai:
      api-key: ${OPEN_AI_API_KEY:''}
      base-url: ${OPEN_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: qwen3.8-max
          temperature: 0.7
          max-tokens: 131072
      embedding:
        options:
          model: text-embedding-v3
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 1000
          multiplier: 2
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          username: ${MILVUS_USERNAME:}
          password: ${MILVUS_PASSWORD:}
        database-name: agent_memory
        collection-name: agent_memories
        index-type: IVF_FLAT
        metric-type: COSINE
        embedding-dimension: 1536
        initialize-schema: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms

app:
  memory:
    # 短期记忆（STM）存储: local(默认) | redis
    stm:
      type: ${APP_MEMORY_STM_TYPE:local}
    # 长期记忆（LTM）存储: local(默认) | milvus
    ltm:
      type: ${APP_MEMORY_LTM_TYPE:local}
    # 上下文压缩配置
    context:
      # 模型上下文窗口大小（token），超阈值的会话历史会被压缩
      max-tokens: ${APP_MEMORY_CONTEXT_MAX_TOKENS:128000}
    # 向量检索配置
    vector:
      # 语义检索相似度阈值：低于该值的片段视为不相关，默认 0.2（宽召回，配合 LLM 精排）
      similarity-threshold: ${APP_MEMORY_VECTOR_SIMILARITY_THRESHOLD:0.2}
    # 会话记忆检索工具二次过滤阈值：低于该分数的片段丢弃
    min-score: ${APP_MEMORY_MIN_SCORE:0.35}
  rag:
    # 文档知识库检索工具二次过滤阈值：低于该分数的片段丢弃
    min-score: ${APP_RAG_MIN_SCORE:0.35}
    # 单份文档解析文本长度上限（字符），超限截断，防止大文件耗尽内存
    max-text-length: ${APP_RAG_MAX_TEXT_LENGTH:3000000}
    # 文档解析缓存：文件内容哈希为 key，重复上传时跳过解析（图片型文档避免重复调用视觉模型）
    cache:
      # 存储后端: local(默认, 本地内存) | redis（写入 Redis，带 TTL，重启不丢）
      type: ${APP_RAG_CACHE_TYPE:local}
      # 缓存 TTL（小时），过期后重新解析
      parse-ttl-hours: ${APP_RAG_CACHE_PARSE_TTL_HOURS:24}
    # 图片内容视觉描述配置（图片型 PDF 页面、直接上传的图片文件）
    vision:
      # 是否启用视觉描述：启用后图片内容用 dashscope 多模态模型描述为文字后入库
      enabled: ${APP_RAG_VISION_ENABLED:true}
      # 视觉描述模型（DashScope qwen-vl 系列）
      model: ${APP_RAG_VISION_MODEL:qwen3.7-flash-2026-07-15}
      # DashScope API Key
      api-key: ${APP_RAG_VISION_API_KEY:}
      # DashScope 服务地址（默认 https://dashscope.aliyuncs.com/api/v1）
      base-url: ${APP_RAG_VISION_BASE_URL:}
      # 渲染 PDF 页面的 DPI，越高描述越准但耗时越长
      pdf-dpi: ${APP_RAG_VISION_PDF_DPI:150}
    # 文档切块策略: semantic(默认) | fixed
    splitter:
      strategy: ${APP_RAG_SPLITTER:semantic}
      # fixed 策略：固定 token 切块大小
      fixed-chunk-size: ${APP_RAG_FIXED_CHUNK:500}
      # semantic 策略：断点判定模式 percentile(默认) | fixed
      semantic-breakpoint-mode: ${APP_RAG_SEMANTIC_MODE:percentile}
      # percentile 模式：差异序列取第 N 百分位为断点阈值
      semantic-percentile: ${APP_RAG_SEMANTIC_PERCENTILE:95}
      # fixed 模式：相邻段相似度低于该值处断句
      semantic-threshold: ${APP_RAG_SEMANTIC_THRESHOLD:0.7}
      # semantic 策略：滑动窗口大小
      semantic-buffer-size: ${APP_RAG_SEMANTIC_BUFFER:3}
      # semantic 策略：单块最大字符数，超限二次固定切分
      semantic-max-chunk: ${APP_RAG_SEMANTIC_MAX_CHUNK:800}

server:
  port: 8080

logging:
  level:
    com.litlebro.agent: DEBUG
    org.springframework.ai.chat.client.advisor: DEBUG
